name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: tests need no write access.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No install scripts from dependencies; the build is run explicitly.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Tests without JSON.rawJSON (the fallback path)
        run: node --import ./test/isolate.ts --import ./test/fixtures/no-rawjson.mjs --test "test/**/*.test.ts"
      - run: npm run build
      - name: The built CLI runs
        run: node dist/bin.js detectors && node dist/bin.js env --shell bash

  # The published package is plain JavaScript and promises Node 22.15+ (the tests need 22.18+ for
  # type stripping, so they run above). Build with a current Node, run the build on the oldest.
  minimum-node:
    name: Built package on Node 22.15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.15.0'
      - name: The built CLI redacts on 22.15
        run: |
          node --version
          node dist/bin.js detectors
          printf 'key sk-proj-%s mail li.wei@corp-mail.cn {"order":12345678901234567890}' Qw3rTy6uIo9pAs2dFg5hJk8lQw3rTy6uIo9pAs2dFg5hJk8l | node dist/bin.js scan - | tee out.txt
          grep -q 'REDACTED:openai_key' out.txt && grep -q 'REDACTED:email' out.txt && ! grep -q 'li.wei@' out.txt
